openapi: 3.1.0

info:
  title: FPS Web3 Asset Gateway
  version: 0.1.0
  description: |
    游戏后端暴露给 Unity 客户端的资产接口。这是 Web3 侧与游戏侧之间的**唯一契约**。

    分工：
      - Web3 侧（本仓库）负责实现这套 API，以及它背后的合约调用与签名。
      - Unity 侧只依赖 `IGameAssetGateway`（packages/unity-sdk），不关心链。

    两条铁律：
      1. 客户端上报的资产信息一律不可信。`PUT /v1/loadout` 只是"意图"，
         服务器必须独立校验所有权。
      2. 本 API 的任何故障都不得阻断核心游戏体验。客户端应捕获错误并降级到
         默认皮肤，而不是拦住玩家进游戏。

servers:
  - url: https://api.example.com
    description: 占位，按实际部署替换

security:
  - gameSession: []

paths:
  /v1/assets:
    get:
      summary: 玩家的皮肤库存与待领奖励
      description: |
        大厅进入时调用一次。**不要在对局中调用** —— 进入对局后资产快照已由
        游戏服务器冻结。

        数据来自后端缓存，不实时查链。`stalenessSeconds` 告知滞后程度。
      operationId: getPlayerAssets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayerAssets"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/wallet/bind:
    post:
      summary: 发起钱包绑定
      description: |
        返回的 `bindUrl` 必须在**系统浏览器**中打开，不能用 Unity 内嵌 WebView。
        绑定页面走 SIWE（EIP-4361）签名，后端验签后把 playerId ↔ address 关联。

        后端不持有玩家私钥，只记录地址。
      operationId: beginWalletBind
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalletBindSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: 该账号已绑定钱包，换绑需走冷却流程
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /v1/wallet/bind/{sessionId}:
    get:
      summary: 轮询绑定结果
      operationId: pollWalletBind
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalletBindStatus"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/rewards/{rewardId}/claim:
    post:
      summary: 请求领取奖励
      description: |
        后端可以用两种方式实现，客户端不需要知道是哪种：

        - **push**（`requiresPlayerAction: false`）：后端用 OPERATOR_ROLE 调
          `RewardDistributor.mintDirect`，后端付 gas，玩家零操作。
          必须传幂等的 requestId，重试不会重复发奖。demo 体验最顺。
        - **pull**（`requiresPlayerAction: true`）：后端签发 EIP-712 voucher，
          返回一个让玩家在浏览器里确认的 `actionUrl`。未领取的奖励不上链。

        这个接口必须幂等：重复调用同一 rewardId 不产生第二次铸造。
      operationId: requestClaim
      parameters:
        - name: rewardId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClaimTicket"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: 尚未绑定钱包，或奖励已领取/已过期
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /v1/rewards/{rewardId}:
    get:
      summary: 轮询领取进度
      operationId: pollReward
      parameters:
        - name: rewardId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RewardStatus"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/loadout:
    put:
      summary: 提交出场配置
      description: |
        服务器必须校验每个 tokenId 当前确实属于该玩家且状态为 confirmed。
        任何一项不通过就整体拒绝。
      operationId: setLoadout
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoadoutRequest"}
      responses:
        "204": {description: 已保存}
        "403":
          description: 配置中包含玩家未拥有的资产
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /internal/v1/entitlement-check:
    post:
      summary: 开局前的资产核验（服务器到服务器）
      description: |
        由**游戏服务器**调用，不是客户端。返回的 snapshotId 即开局快照，
        游戏服务器持有它直到本局结束；对局期间玩家转移 NFT 不影响本局渲染。

        这个端点不在 `IGameAssetGateway` 里 —— Unity 客户端不应该能调用它。
      operationId: entitlementCheck
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, tokenIds]
              properties:
                playerId: {type: string}
                tokenIds:
                  type: array
                  items: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [valid, snapshotId]
                properties:
                  valid: {type: boolean}
                  snapshotId: {type: string}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SkinItem"}

components:
  securitySchemes:
    gameSession:
      type: http
      scheme: bearer
      description: 游戏账号的会话 token。身份是账号，不是钱包。
    serviceToken:
      type: http
      scheme: bearer
      description: 服务间调用凭据，仅内网可达。

  responses:
    Unauthorized:
      description: 会话无效或已过期
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 机器可读错误码
          examples: ["wallet_not_bound", "reward_not_found", "not_owned"]
        message: {type: string}

    SkinItem:
      type: object
      required: [tokenId, skinDefId, serial, maxSupply, wear, rarity, seasonId, bundleUri, contentHash, state]
      properties:
        tokenId:
          type: string
          description: |
            链上 tokenId = (skinDefId << 32) | serial。
            **必须序列化为字符串** —— uint256 放不进 JS 的 number 或 C# 的 ulong。
          examples: ["4475210235940901"]
        skinDefId: {type: integer, format: int64}
        serial: {type: integer, format: int64, description: "款式内序号，从 1 开始"}
        maxSupply: {type: integer, format: int64, description: "用于展示 #37 / 500"}
        wear:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 后端已从链上的万分比整数换算
        rarity: {type: integer, minimum: 0, maximum: 4}
        seasonId: {type: integer, format: int64}
        bundleUri: {type: string, format: uri}
        contentHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
          description: |
            AssetBundle 的 keccak256 承诺。客户端下载后必须本地校验。
            注意 keccak256 与 SHA3-256 的 padding 不同，不能用标准库 SHA3。
        state:
          type: string
          enum: [confirmed, pending]
          description: pending 表示链上尚未达到确认数，不可用于 loadout

    PendingReward:
      type: object
      required: [rewardId, skinDefId, rarity, expiresAt]
      properties:
        rewardId: {type: string}
        skinDefId: {type: integer, format: int64}
        rarity: {type: integer}
        expiresAt: {type: string, format: date-time}

    PlayerAssets:
      type: object
      required: [playerId, wallet, items, pendingRewards, stalenessSeconds]
      properties:
        playerId: {type: string}
        wallet:
          type: string
          description: 未绑定时为空字符串（不是 null —— Unity 的 JsonUtility 对 null 处理不好）
        items:
          type: array
          items: {$ref: "#/components/schemas/SkinItem"}
        pendingRewards:
          type: array
          items: {$ref: "#/components/schemas/PendingReward"}
        stalenessSeconds:
          type: integer
          description: 后端数据相对链上的滞后秒数

    WalletBindSession:
      type: object
      required: [sessionId, bindUrl, expiresAt]
      properties:
        sessionId: {type: string}
        bindUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}

    WalletBindStatus:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [pending, bound, expired, failed]}
        wallet: {type: string}
        error: {type: string}

    ClaimTicket:
      type: object
      required: [rewardId, requiresPlayerAction]
      properties:
        rewardId: {type: string}
        requiresPlayerAction: {type: boolean}
        actionUrl: {type: string, format: uri}

    RewardStatus:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [claimable, claiming, claimed, failed, expired]}
        tokenId: {type: string}
        error: {type: string}

    LoadoutRequest:
      type: object
      required: [tokenIdsBySlot]
      properties:
        tokenIdsBySlot:
          type: array
          description: 按武器槽位排列；空字符串表示该槽位用默认皮肤
          items: {type: string}

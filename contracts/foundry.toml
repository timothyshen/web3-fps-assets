[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["WeaponSkin", "RewardDistributor", "SkinMarket", "GameAssetRegistry"]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1024

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 84532}
